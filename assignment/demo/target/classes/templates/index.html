<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Weather Forecast</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }

        button {
            background: #2878d0;
            color: white;
            border: none;
            cursor: pointer;
        }

        .forecast {
            margin-top: 25px;
            padding: 20px;
            background: #eaf3ff;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Weather Forecast</h2>

    <form id="weatherForm">

        <label for="area">Select Area:</label>

        <select id="area" name="area" required>
            <option value="">-- Select an area --</option>
        </select>

        <button type="submit">Get Forecast</button>

    </form>

    <div id="weatherResult" class="forecast" style="display:none;">
    </div>

</div>
    <hr>
    
    <h2>UEN Validation</h2>

    <form id="uenForm">

        <label for="uen">Enter Singapore UEN:</label>

        <input
            type="text"
            id="uen"
            name="uen"
            placeholder="e.g. 202412345A"
            required
        >

        <button type="submit">Validate UEN</button>

    </form>

    <div id="uenResult" class="uen-result" style="display:none;">

        <h3>Validation Result</h3>

        <p>
            UEN:
            <strong id="resultUen"></strong>
        </p>

        <p>
            Format Valid:
            <strong id="resultValid"></strong>
        </p>

        <p>
            Entity Type:
            <strong id="resultType"></strong>
        </p>

    </div>

</div>

<script>

    // for weather
    document.getElementById("weatherForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const area = document.getElementById("area").value;
        const resultDiv = document.getElementById("weatherResult");

        resultDiv.style.display = "block";

        try {

            const response = await fetch(
                "/weather?area=" + encodeURIComponent(area)
            );

            if (!response.ok) {
                throw new Error("Failed to retrieve forecast");
            }

            const data = await response.json();

            resultDiv.innerHTML = `
                <h3>${data.area}</h3>
                <p>
                    Forecast:
                    <strong>${data.forecast}</strong>
                </p>
            `;

        } catch (error) {
        resultDiv.innerHTML = `
                                <p class="error">${error.message}</p>
                            `;

        console.error(error);
        }

    });

    async function loadWeatherAreas() {

        const areaSelect = document.getElementById("area");

        try {

            const response = await fetch("/weather");

            if (!response.ok) {
                throw new Error("Failed to load weather areas");
            }

            const forecasts = await response.json();

            forecasts.forEach(item => {

                const option = document.createElement("option");

                option.value = item.area;
                option.textContent = item.area;

                areaSelect.appendChild(option);

            });

        } catch (error) {
            console.error(error);
        }
    }

    loadWeatherAreas(); //to run the above function

    // for uen
    document.getElementById("uenForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const uen = document.getElementById("uen").value.trim().toUpperCase();

        const resultDiv = document.getElementById("uenResult");

        resultDiv.style.display = "block";
        resultDiv.innerHTML = "Checking UEN...";

        try {

            const response = await fetch(
                "/uen/validate?uen=" + encodeURIComponent(uen)
            );

            if (!response.ok) {
                throw new Error("API request failed: " + response.status);
            }

            const data = await response.json();

            resultDiv.innerHTML = `
                <h3>Validation Result</h3>

                <p>UEN: <strong>${data.uen}</strong></p>

                <p>
                    Format Valid:
                    <strong class="${data.validFormat ? 'success' : 'error'}">
                        ${data.validFormat ? 'Yes' : 'No'}
                    </strong>
                </p>

                <p>Entity Type: <strong>${data.entityType}</strong></p>
            `;

        } catch (error) {

            resultDiv.innerHTML = `
                <h3 class="error">Error</h3>
                <p>${error.message}</p>
            `;

            console.error(error);
        }

    });

</script>

</body>
</html>
